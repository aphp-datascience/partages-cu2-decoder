[project]
name = "partages-cu2-decoder"
version = "0.1.0"
description = "PARTAGES CU2: fine-tuned LLM coding the French ICD-10 (PMSI) principal diagnosis of hospital stays"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
# Same environment as the CU2 agent (tested on Jean Zay A100); uv.lock pins the rest.
dependencies = [
    "vllm==0.32.0",
    "torch==2.13.0",
    "transformers==5.19.0",
    "rank-bm25==0.2.2",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "huggingface-hub==2.4.0",
]

[project.optional-dependencies]
# scripts/finetune.py only
finetune = ["peft>=0.17"]

[tool.uv]
# vLLM on GPU: Linux x86_64 only.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Indirect dependencies aligned on the tested environment (uv picked newer CUDA libraries, triton and protobuf).
constraint-dependencies = [
    "triton==3.7.1",
    "protobuf==7.36.2",
    "nvidia-cublas==13.1.1.3",
    "nvidia-cuda-nvrtc==13.0.88",
    "nvidia-cuda-runtime==13.0.96",
]

[tool.ruff]
line-length = 120
